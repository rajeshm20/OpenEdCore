# Docker Compose file for Vapor
#
# Install Docker on your system to run and test
# your Vapor app in a production-like environment.
#
# Note: This file is intended for testing and does not
# implement best practices for a production deployment.
#
# Learn more: https://docs.docker.com/compose/reference/
#
#   Build images: docker compose build
#      Start app: docker compose up app
# Start database: docker compose up db
# Run migrations: docker compose run migrate
#       Stop all: docker compose down (add -v to wipe db)
#

volumes:
  postgres_data:

x-shared_environment: &shared_environment
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  DATABASE_HOST: db
  DATABASE_PORT: 5432
  DATABASE_DRIVER: ${DATABASE_DRIVER:-postgres}
  DATABASE_NAME: ${DATABASE_NAME:-student_db}
  DATABASE_USER: ${DOCKER_DATABASE_USER:-studentapp}
  DATABASE_PASSWORD: ${DOCKER_DATABASE_PASSWORD:-local-dev-db-password-not-for-prod}
  DATABASE_TLS_MODE: ${DOCKER_DATABASE_TLS_MODE:-insecure}
  JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-at-least-32-chars}
  SENDGRID_API_KEY: ${SENDGRID_API_KEY}
  FROM_EMAIL: ${FROM_EMAIL:-noreply@openedschool.com}
  ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8081}
  ENABLE_GRAPHIQL: ${ENABLE_GRAPHIQL:-true}

services:
  app:
    image: openedcore:latest
    build:
      context: .
    environment:
      <<: *shared_environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '8081:8080'
    # user: '0' # uncomment to run as root for testing purposes even though Dockerfile defines 'vapor' user.
    command: ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "8080"]
  migrate:
    image: openedcore:latest
    build:
      context: .
    environment:
      <<: *shared_environment
    depends_on:
      db:
        condition: service_healthy
    command: ["migrate", "--yes"]
    restart: "no"
  revert:
    image: openedcore:latest
    build:
      context: .
    environment:
      <<: *shared_environment
    depends_on:
      - db
    command: ["migrate", "--revert", "--yes"]
    deploy:
      replicas: 0
  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DOCKER_DATABASE_USER:-studentapp}
      POSTGRES_PASSWORD: ${DOCKER_DATABASE_PASSWORD:-local-dev-db-password-not-for-prod}
      POSTGRES_DB: ${DATABASE_NAME:-student_db}
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DOCKER_DATABASE_USER:-studentapp} -d ${DATABASE_NAME:-student_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  mailpit:
    image: axllent/mailpit:latest
    container_name: openedcore-mailpit
    restart: unless-stopped
    ports:
      - '8025:8025'   # Web UI & REST API
      - '1025:1025'   # SMTP port
    environment:
      MP_MAX_MESSAGES: 500
  test:
    image: swift:6.0-noble
    working_dir: /app
    volumes:
      - .:/app
      - ./.env:/app/.env
    environment:
      <<: *shared_environment
    depends_on:
      db:
        condition: service_healthy
    command: ["swift", "test"]
    deploy:
      replicas: 0
